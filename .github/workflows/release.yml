name: Build and Release Patte

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare configuration
        shell: powershell
        run: |
          Copy-Item .env.example .env -Force

      - name: Compile Standalone Patte
        shell: powershell
        run: |
          pyinstaller -y --distpath dist --workpath build whisprflow.spec

      - name: Copy config to dist Patte
        shell: powershell
        run: |
          Copy-Item .env.example dist\Patte\.env -Force

      - name: Package Standalone Zip
        shell: powershell
        run: |
          Compress-Archive -Path dist\Patte\* -DestinationPath dist\Patte-Windows-x64.zip -Force

      - name: Create Installer Payload Zip
        shell: powershell
        run: |
          Compress-Archive -Path dist\Patte\* -DestinationPath Patte_payload.zip -Force

      - name: Compile Self-Contained Patte-Setup.exe Installer
        shell: powershell
        run: |
          pyinstaller -y --onefile --noconsole --name "Patte-Setup" --icon "assets\icon.ico" --add-data "Patte_payload.zip;." --distpath dist --workpath build installer_setup.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Patte-Setup.exe
            dist/Patte-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
